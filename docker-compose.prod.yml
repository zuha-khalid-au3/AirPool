version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: airpool-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./packages/backend/.env
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
    networks:
      - airpool-network

  # Admin Panel (built static files served by Nginx)
  admin:
    build:
      context: ./packages/admin
      dockerfile: Dockerfile
    container_name: airpool-admin
    restart: unless-stopped
    ports:
      - '3001:80'
    depends_on:
      - backend
    networks:
      - airpool-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: airpool-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - admin
    networks:
      - airpool-network

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: airpool-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-airpool_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-airpool_secret_2024}
      MONGO_INITDB_DATABASE: airpool
    volumes:
      - mongodb_data:/data/db
    networks:
      - airpool-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: airpool-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-airpool_redis_2024}
    volumes:
      - redis_data:/data
    networks:
      - airpool-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: airpool-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-airpool}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-airpool_rabbit_2024}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - airpool-network

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: airpool-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-airpool_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-airpool_minio_2024}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - airpool-network

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  airpool-network:
    driver: bridge
